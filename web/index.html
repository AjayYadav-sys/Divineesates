<style>

function next(){if(S.step==0){if(!S.d.property_name.trim()||!S.d.location.trim()){S.err="Property name and location are required.";return render()}}
if(S.step==1&&(S.photos.length<4||S.photos.length>8)){S.err=`Add 4–8 photos (currently ${S.photos.length}).`;return render()}S.step++;S.job=null;anim=1;render()}
async function ensureScript(){const d=JSON.stringify(details());if(S.script&&S.sig==d)return;try{S.script=(await (await fetch("/api/script",{method:"POST",body:d})).json()).voiceover||"";S.sig=d;const t=$("script");if(t)t.value=S.script}catch(e){}}
/* ---------------- generation ---------------- */
function prog(f,stage,rows){if(!$("bar"))return;$("bar").style.width=Math.round(f*100)+"%";$("ringb").style.strokeDashoffset=314*(1-f);$("pct").textContent=Math.round(f*100)+"%";$("stg").textContent=stage;
$("rows").innerHTML=rows.map(r=>`<div class="${r[0]?"ok":""}">${r[0]?"✓":"◌"}  ${r[1]}</div>`).join("")}
async function startGen(){const my=++poll;boost=1;prog(0,"Preparing property photos",[[0,"Preparing property photos"],[0,"Preparing captions and script"],[0,"Rendering scenes and encoding MP4"]]);
try{const images=await Promise.all(S.photos.map(async p=>({data:await toData(p.blob),caption:p.caption})));
const{id}=await (await fetch("/api/generate",{method:"POST",body:JSON.stringify({details:details(),images,voice:S.voice,voiceover:S.script,scene_seconds:S.secs,music_data:S.music&&S.music.data,music_name:S.music&&S.music.name})})).json();
if(!id)throw Error("The server refused the request.");
for(;;){await new Promise(r=>setTimeout(r,700));if(my!=poll)return;const s=await (await fetch("/api/status/"+id)).json();if(!$("bar"))return;
if(!s.done){prog(s.frac||0,s.stage||"",[[1,"Preparing property photos"],[1,"Preparing captions and script"],[0,s.stage||"Rendering"]]);continue}
boost=0;if(s.error)return fail(s.error);return done(s)}}catch(e){boost=0;fail(e.message||"Could not reach the server. Is Divineestates_server.py running?")}}
function fail(m){$("prog")&&$("prog").classList.remove("on");$("rows").innerHTML="";$("msg").innerHTML=`<div class="er" role="alert">${esc(m)}</div><div class="nav2"><button class="ghost" data-a="back">← Back to Style</button><button class="cta" onclick="S.step=3;render()">Retry</button></div>`}
function done(s){$("prog").classList.remove("on");$("bar").style.width="100%";const m=s.info.meta||{};$("rows").innerHTML=[ "Preparing property photos","Preparing captions and script","MP4 exported successfully"].map(x=>`<div class="ok">✓  ${x}</div>`).join("");
$("frame").insertAdjacentHTML("beforeend",`<video src="${s.video}" controls autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>`);
$("msg").innerHTML=`<div class="okb">Video exported · ${m.duration_seconds??"—"} sec · ${m.resolution??""} · ${m.file_size_mb??"—"} MB</div>${(s.warnings||[]).map(w=>`<div class="er">${esc(w)}</div>`).join("")}<div class="btns"><a class="cta" style="text-decoration:none;display:inline-block" href="${s.video}" download>Download MP4</a><button class="ghost" onclick="location.hash='#/videos'">My Videos</button><button class="ghost" onclick="S=fresh();location.hash='#/create';render()">New video</button></div>`}
async function loadVideos(){const r=await (await fetch("/api/videos")).json();$("vl").innerHTML=r.length?r.map(x=>`<div class="card vr tilt"><video src="${x.video}" controls preload="metadata"></video><div><h3>${esc(x.name)}</h3><small>${esc(x.location)}</small><small>Created ${esc(x.created_at)}</small><small>${x.meta.duration_seconds??"—"} sec · ${x.meta.resolution??"—"} · ${x.meta.file_size_mb??"—"} MB</small></div><div class="a"><a class="cta" style="text-decoration:none;text-align:center;padding:12px 22px" href="${x.video}" download>Download MP4</a><button class="ghost danger" data-a="del" data-f="${x.file}">Delete</button></div></div>`).join(""):`<div class="card"><h2>No videos generated yet</h2><p class="sub">Your exported videos will appear here.</p><button class="cta" style="width:auto;padding:14px 30px" onclick="S.step=0;location.hash='#/create'">Create New Video</button></div>`;bindTilt()}
render();
</script></body></html>
